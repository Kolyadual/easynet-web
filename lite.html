<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyNET lite start</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#111;
  color:#d4d4d4;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  text-align:center;
  padding:12% 16px 40px;
  line-height:1.5
}
h1{
  font-size:1.6em;
  font-weight:300;
  letter-spacing:.15em;
  color:#888;
  margin-bottom:1.8em
}
.search-group{margin-bottom:2.2em}
.search-form{margin-bottom:12px}
.search-form input[type=text]{
  width:100%;
  max-width:420px;
  padding:10px 14px;
  font-size:1em;
  color:#e0e0e0;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:6px;
  outline:none
}
.search-form input[type=text]:focus{border-color:#5b7fa6}
.search-form button{
  display:block;
  margin:8px auto 0;
  padding:7px 20px;
  font-size:.85em;
  color:#c0c0c0;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:5px;
  cursor:pointer
}
.search-form button:active{background:#252525}
.extra{margin-bottom:2.4em}
.extra-title{
  font-size:.75em;
  color:#555;
  text-transform:uppercase;
  letter-spacing:.12em;
  margin-bottom:.6em
}
.mini-form{margin-bottom:5px}
.mini-form input[type=text]{
  width:180px;
  padding:5px 8px;
  font-size:.82em;
  color:#d0d0d0;
  background:#161616;
  border:1px solid #2a2a2a;
  border-radius:4px;
  vertical-align:middle
}
.mini-form button{
  padding:5px 11px;
  font-size:.8em;
  color:#aaa;
  background:#181818;
  border:1px solid #2a2a2a;
  border-radius:4px;
  vertical-align:middle;
  cursor:pointer
}
hr{
  border:none;
  border-top:1px solid #222;
  max-width:320px;
  margin:0 auto 1.6em
}
.links a{
  display:inline-block;
  margin:4px 8px;
  padding:5px 0;
  font-size:.85em;
  color:#5b7fa6;
  text-decoration:none
}
.links a:active{color:#8ab4e8}
</style>
</head>
<body>

<h1>· EasyNET lite start ·</h1>

<div class="search-group">
  <form class="search-form" action="https://lite.duckduckgo.com/lite/" method="get">
    <input type="text" name="q" placeholder="Search with DuckDuckGo…" autocomplete="off">
    <button type="submit">DuckDuckGo</button>
  </form>

  <form class="search-form" action="https://wiby.me/" method="get">
    <input type="text" name="q" placeholder="Search with Wiby…" autocomplete="off">
    <button type="submit">Wiby</button>
  </form>

  <form class="search-form" action="https://www.mojeek.com/search" method="get">
    <input type="text" name="q" placeholder="Search with Mojeek…" autocomplete="off">
    <button type="submit">Mojeek</button>
  </form>

  <form class="search-form" action="https://searx.be/search" method="get">
    <input type="text" name="q" placeholder="Search with SearXNG…" autocomplete="off">
    <button type="submit">SearXNG</button>
  </form>

  <form class="search-form" action="https://4get.ca/web" method="get">
    <input type="text" name="q" placeholder="Search with 4get…" autocomplete="off">
    <button type="submit">4get</button>
  </form>
</div>

<div class="extra">
  <div class="extra-title">more</div>

  <form class="mini-form" action="https://search.yacy.net/yacysearch/index.html" method="get">
    <input type="text" name="query" placeholder="YaCy…">
    <button type="submit">YaCy</button>
  </form>

  <form class="mini-form" action="https://search.marginalia.nu/search" method="get">
    <input type="text" name="query" placeholder="Marginalia…">
    <button type="submit">Marginalia</button>
  </form>
</div>

<hr>

<div class="links">
  <a href="https://ru.wikipedia.org">Wiki</a>
  <a href="https://github.com">GitHub</a>
  <a href="https://habr.com">Habr</a>
  <a href="https://old.reddit.com">Reddit</a>
  <a href="https://youtube.com">YouTube</a>
  <a href="https://lite.cnn.com">CNN Lite</a>
</div>

</body>
</html>

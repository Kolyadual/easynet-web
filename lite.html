<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyNET lite start</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#111;
  color:#d4d4d4;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  text-align:center;
  padding:12% 16px 40px;
  line-height:1.5
}
h1{
  font-size:1.6em;
  font-weight:300;
  letter-spacing:.15em;
  color:#888;
  margin-bottom:1.8em
}
/* ── основной поиск ── */
.main-search{margin-bottom:.6em}
.main-search input[type=text]{
  width:100%;
  max-width:420px;
  padding:10px 14px;
  font-size:1em;
  color:#e0e0e0;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:6px;
  outline:none
}
.main-search input[type=text]:focus{border-color:#5b7fa6}
.btns{margin-top:.7em;margin-bottom:2.2em}
.btns button{
  display:inline-block;
  margin:4px 3px;
  padding:7px 15px;
  font-size:.85em;
  color:#c0c0c0;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:5px;
  cursor:pointer
}
.btns button:active{background:#252525}

/* ── доп. поисковики ── */
.extra{margin-bottom:2.4em}
.extra-title{
  font-size:.75em;
  color:#555;
  text-transform:uppercase;
  letter-spacing:.12em;
  margin-bottom:.6em
}
.mini-form{margin-bottom:5px}
.mini-form input[type=text]{
  width:180px;
  padding:5px 8px;
  font-size:.82em;
  color:#d0d0d0;
  background:#161616;
  border:1px solid #2a2a2a;
  border-radius:4px;
  vertical-align:middle
}
.mini-form button{
  padding:5px 11px;
  font-size:.8em;
  color:#aaa;
  background:#181818;
  border:1px solid #2a2a2a;
  border-radius:4px;
  vertical-align:middle;
  cursor:pointer
}

/* ── разделитель ── */
hr{
  border:none;
  border-top:1px solid #222;
  max-width:320px;
  margin:0 auto 1.6em
}

/* ── быстрые ссылки ── */
.links a{
  display:inline-block;
  margin:4px 8px;
  padding:5px 0;
  font-size:.85em;
  color:#5b7fa6;
  text-decoration:none
}
.links a:active{color:#8ab4e8}
</style>
</head>
<body>

<h1>· старт ·</h1>

<!-- ════ Основной поиск (параметр q) ════ -->
<form class="main-search" action="https://lite.duckduckgo.com/lite/" method="get">
  <input type="text" name="q" placeholder="search for…" autocomplete="off">
  <div class="btns">
    <button type="submit" formaction="https://lite.duckduckgo.com/lite/">DuckDuckGo</button>
    <button type="submit" formaction="https://wiby.me/">Wiby</button>
    <button type="submit" formaction="https://www.mojeek.com/search">Mojeek</button>
    <button type="submit" formaction="https://searx.be/search">SearXNG</button>
    <button type="submit" formaction="https://4get.ca/web">4get</button>
  </div>
</form>

<!-- ════ Доп. поисковики (параметр query) ════ -->
<div class="extra">
  <div class="extra-title">More</div>

  <form class="mini-form" action="https://search.yacy.net/yacysearch/index.html" method="get">
    <input type="text" name="query" placeholder="YaCy…">
    <button type="submit">YaCy</button>
  </form>

  <form class="mini-form" action="https://search.marginalia.nu/search" method="get">
    <input type="text" name="query" placeholder="Marginalia…">
    <button type="submit">Marginalia</button>
  </form>
</div>

<hr>

<!-- ════ Быстрые ссылки ════ -->
<div class="links">
  <a href="https://ru.wikipedia.org">Wiki</a>
  <a href="https://github.com">GitHub</a>
  <a href="https://habr.com">Habr</a>
  <a href="https://old.reddit.com">Reddit</a>
  <a href="https://youtube.com">YouTube</a>
  <a href="https://lite.cnn.com">CNN Lite</a>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EasyNET — Поиск</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            color: #222;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .search-box {
            display: inline-flex;
            align-items: center;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 5px;
        }
        input[type="text"] {
            width: 400px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        button[type="submit"] {
            padding: 8px 16px;
            margin-left: 5px;
            border: none;
            background: #4a90d9;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        details {
            display: inline-block;
            margin-left: 5px;
        }
        summary {
            cursor: pointer;
            background: #eee;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .menu {
            position: absolute;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 5px;
        }
        .menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .menu button:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>EasyNET</h1>
    <p>Приватный и лёгкий браузер</p>

    <form action="https://lite.duckduckgo.com/lite/" method="GET">
        <div class="search-box">
            <input type="text" name="q" placeholder="Введите запрос...">
            <button type="submit">Искать</button>
            <details>
                <summary>Выбор поисковика ▾</summary>
                <div class="menu">
                    <button type="submit" formaction="https://lite.duckduckgo.com/lite/">DuckDuckGo Lite</button>
                    <button type="submit" formaction="https://www.mojeek.com/search">Mojeek</button>
                    <button type="submit" formaction="https://wiby.me/">Wiby</button>
                    <button type="submit" formaction="https://search.marginalia.nu/search">Marginalia</button>
                    <button type="submit" formaction="https://searx.be/search">SearXNG</button>
                </div>
            </details>
        </div>
    </form>

    <p style="margin-top: 30px;"><a href="https://kolyadual.github.io/easynet-web/">О проекте EasyNET</a></p>
</body>
</html>
